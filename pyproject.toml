[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyjal3dsmcp"
version = "2.2.0"
description = "PyJal3DSMCP: Upstream 3dsmax-mcp MCP server plus DLEL library tools for registered Python libraries"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["3dsmax", "3ds-max", "autodesk", "mcp", "model-context-protocol", "pyjal"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "tomlkit>=0.13",
    "3dsmax-mcp @ git+https://github.com/cl0nazepamm/3dsmax-mcp@82f555275c4d030e0125898526c9a93e19532a1e",
]

[project.urls]
Repository = "https://github.com/jalnaga/PyJal3DSMCP"
Upstream = "https://github.com/cl0nazepamm/3dsmax-mcp"

[project.scripts]
pyjal3dsmcp-team = "pyjal3dsmcp.team_cli:main"
pyjal3dsmcp = "pyjal3dsmcp.server:main"
pyjal3dsmcp-install = "pyjal3dsmcp.installer:main"
pyjal3dsmcp-update = "pyjal3dsmcp.installer:update_main"
pyjal3dsmcp-uninstall = "pyjal3dsmcp.installer:uninstall_main"

[tool.hatch.build.hooks.custom]
path = "pyjal3dsmcp/build_hook.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["pyjal3dsmcp", "pyjal_extensions"]

[tool.hatch.build.targets.wheel.force-include]
"docs/pyjal/examples/pyjal3dsmcp-team.example.toml" = "pyjal3dsmcp/docs/pyjal3dsmcp-team.example.toml"
"docs/pyjal/DLEL-AGENT-GUIDE.md" = "pyjal3dsmcp/docs/DLEL-AGENT-GUIDE.md"

[tool.hatch.build.targets.sdist]
only-include = ["docs/pyjal/examples/pyjal3dsmcp-team.example.toml", "pyjal3dsmcp", "pyjal_extensions", "docs/pyjal/DLEL-AGENT-GUIDE.md", "README.md", "LICENSE"]
